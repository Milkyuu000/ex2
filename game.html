<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>夜市寻物</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html, body{
            width: 100%;
            height: 100%;
        }
        body{
            background:#1a3b2f;
            font-family:"Microsoft Yahei";
            overflow:hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-box{
            width:1200px;
            height:700px;
            position:relative;
            border:2px solid #8b4513;
            background:url("img/nightmarket.jpg") center/cover no-repeat;
            flex-shrink: 0;
        }
        .top-bar{
            position:absolute;
            top:20px;
            left:20px;
            z-index:99;
            display:flex;
            align-items:center;
            gap:12px;
        }
        #timeShow{
            font-size:32px;
            color:#8b0000;
            background:rgba(255,255,255,0.75);
            padding:6px 16px;
            border-radius:8px;
        }
        #scoreShow{
            font-size:24px;
            color:#6b3820;
            background:rgba(255,255,255,0.75);
            padding:6px 12px;
            border-radius:8px;
        }
        .btn-group{
            display:flex;
            gap:8px;
        }
        #startBtn,#pauseBtn,#stopBtn{
            font-size:20px;
            padding:6px 14px;
            cursor:pointer;
            border:none;
            border-radius:6px;
            color:#fff;
        }
        #startBtn{
            background:#c84b31;
        }
        #pauseBtn{
            background:#317ac8;
        }
        #stopBtn{
            background:#555;
        }
        .back{
            position:absolute;
            top:20px;
            right:20px;
            z-index:99;
        }
        .back a{
            text-decoration:none;
            background:#555;
            color:#fff;
            padding:6px 12px;
            border-radius:6px;
        }
        /* 物品：hover无变化，不动 */
        .item{
            position:absolute;
            width:60px;
            height:60px;
            cursor:pointer;
            opacity:0.92;
        }
        /* 正确标记圆圈 */
        .mark-circle{
            position:absolute;
            width:72px;
            height:72px;
            border:3px solid red;
            border-radius:50%;
            pointer-events:none;
            z-index:90;
        }
        /* 错误叉号 */
        .mark-cross{
            position:absolute;
            font-size:48px;
            color:red;
            font-weight:bold;
            pointer-events:none;
            z-index:90;
        }
        /* 目标提示固定在底部 */
        .target-tip{
            position:absolute;
            left:50%;
            bottom:20px;
            transform:translateX(-50%);
            background:rgba(255,255,255,0.85);
            padding:10px 24px;
            border-radius:10px;
            font-size:22px;
            color:#8b0000;
            z-index:99;
        }
        /* 通关弹窗 */
        .pop{
            display:none;
            position:absolute;
            width:400px;
            height:220px;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            background:#fff;
            border:3px solid #c9a47c;
            border-radius:14px;
            z-index:999;
            text-align:center;
            padding:40px 20px;
        }
        .pop h2{
            color:#8b4513;
            margin-bottom:16px;
        }
        .pop button{
            margin-top:20px;
            padding:8px 20px;
            border:none;
            background:#8b4513;
            color:#fff;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>
<body>
<div class="game-box" id="gameBox">
    <div class="top-bar">
        <div id="timeShow">00:00</div>
        <div id="scoreShow">积分：0 / 8</div>
        <div class="btn-group">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停游戏</button>
            <button id="stopBtn">结束游戏</button>
        </div>
    </div>
    <div class="back">
        <a href="index.html">返回主街景</a>
    </div>
    <!-- 8个寻物元素 -->
    <img class="item" id="umbrella" src="img/umbrella.png" style="top:160px;left:260px;">
    <img class="item" id="candy" src="img/candy.png" style="top:420px;left:760px;">
    <img class="item" id="light" src="img/light.png" style="top:110px;left:840px;">
    <img class="item" id="winepot" src="img/winepot.png" style="top:360px;left:160px;">
    <img class="item" id="fan" src="img/fan.png" style="top:460px;left:520px;">
    <img class="item" id="sachet" src="img/sachet.png" style="top:200px;left:580px;">
    <img class="item" id="teacup" src="img/teacup.png" style="top:330px;left:790px;">
    <img class="item" id="coin" src="img/coin.png" style="top:540px;left:380px;">
    <!-- 目标提示 -->
    <div class="target-tip" id="targetTip"></div>
    <!-- 通关弹窗 -->
    <div class="pop" id="winPop">
        <h2>🎉 游戏结束</h2>
        <p>本次找到：<span id="finalScore"></span> / 8</p>
        <p>用时：<span id="useTime"></span></p>
        <button onclick="restart()">再来一局</button>
    </div>
</div>
<script>
    let timer = null;
    let second = 0;
    let minute = 0;
    let score = 0;
    const total = 8;
    let isPause = false;
    // 物品配置：id + 显示名称
    const itemConfig = [
        {id:"umbrella",name:"油纸伞"},
        {id:"candy",name:"糖画"},
        {id:"light",name:"花灯"},
        {id:"winepot",name:"酒壶"},
        {id:"fan",name:"折扇"},
        {id:"sachet",name:"香囊"},
        {id:"teacup",name:"茶盏"},
        {id:"coin",name:"铜钱"}
    ];
    let remainList = []; // 剩余待找物品
    let currentTarget = null; // 当前要找的目标

    const timeShow = document.getElementById('timeShow');
    const scoreShow = document.getElementById('scoreShow');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const winPop = document.getElementById('winPop');
    const useTimeDom = document.getElementById('useTime');
    const finalScoreDom = document.getElementById('finalScore');
    const targetTip = document.getElementById('targetTip');
    const gameBox = document.getElementById('gameBox');

    function pad(n){
        return n < 10 ? '0'+n : n;
    }
    function updateView(){
        timeShow.innerText = pad(minute)+":"+pad(second);
        scoreShow.innerText = "积分：" + score + " / " + total;
    }
    // 随机挑选一个剩余目标，提示固定在底部
    function pickRandomTarget(){
        if(remainList.length <= 0){
            targetTip.innerText = "";
            return;
        }
        const rndIdx = Math.floor(Math.random() * remainList.length);
        currentTarget = remainList[rndIdx];
        targetTip.innerText = "请找到：" + currentTarget.name;
    }
    // 正确：画红圈
    function addMark(itemDom){
        const circle = document.createElement('div');
        circle.className = "mark-circle";
        circle.style.left = (itemDom.offsetLeft - 6) + "px";
        circle.style.top = (itemDom.offsetTop - 6) + "px";
        gameBox.appendChild(circle);
    }
    // 错误：画叉号，3秒消失
    function addCross(x,y){
        const cross = document.createElement('div');
        cross.className = "mark-cross";
        cross.innerText = "✖";
        cross.style.left = (x - 24) + "px";
        cross.style.top = (y - 24) + "px";
        gameBox.appendChild(cross);
        setTimeout(()=>{
            cross.remove();
        },3000);
    }
    // 初始化游戏
    function initGame(){
        clearInterval(timer);
        second = 0;
        minute = 0;
        score = 0;
        isPause = false;
        winPop.style.display = "none";
        // 清空标记
        document.querySelectorAll('.mark-circle,.mark-cross').forEach(c=>c.remove());
        // 重置剩余列表
        remainList = JSON.parse(JSON.stringify(itemConfig));
        // 清除旧标记
        document.querySelectorAll('.item').forEach(i=>{
            i.dataset.found = "0";
        });
        updateView();
        pickRandomTarget();
    }
    // 弹出结束弹窗
    function showEndPopup(){
        clearInterval(timer);
        timer = null;
        isPause = false;
        pauseBtn.innerText = "暂停游戏";
        finalScoreDom.innerText = score;
        useTimeDom.innerText = pad(minute)+":"+pad(second);
        winPop.style.display = "block";
        // 计时归零
        second = 0;
        minute = 0;
        updateView();
    }
    // 开始游戏
    startBtn.onclick = function(){
        initGame();
        timer = setInterval(function(){
            if(!isPause){
                second++;
                if(second >= 60){
                    second = 0;
                    minute++;
                }
                updateView();
            }
        },1000);
    }
    // 暂停
    pauseBtn.onclick = function(){
        if(!timer) return;
        isPause = !isPause;
        this.innerText = isPause ? "继续游戏" : "暂停游戏";
    }
    // 结束游戏
    stopBtn.onclick = function(){
        if(!timer) return;
        showEndPopup();
    }
    // 物品点击事件
    itemConfig.forEach(cfg=>{
        const itemDom = document.getElementById(cfg.id);
        itemDom.onclick = function(e){
            e.stopPropagation();
            if(!timer || isPause) return;
            if(this.dataset.found === "1") return;
            if(cfg.id === currentTarget.id){
                this.dataset.found = "1";
                addMark(this);
                score++;
                updateView();
                remainList = remainList.filter(x=>x.id !== cfg.id);
                if(score >= total){
                    showEndPopup();
                }else{
                    pickRandomTarget();
                }
            }else{
                // 点到别的物品，错误，出叉
                addCross(this.offsetLeft+30, this.offsetTop+30);
            }
        }
    })
    // 点击游戏空白区域，出叉
    gameBox.onclick = function(e){
        if(!timer || isPause) return;
        // 如果点击的是按钮、弹窗等，不处理
        if(e.target.closest('button') || e.target.closest('.pop') || e.target.closest('.back a')) return;
        const rect = gameBox.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        addCross(x,y);
    }
    function restart(){
        winPop.style.display = "none";
        startBtn.click();
    }
</script>
</body>
</html>
